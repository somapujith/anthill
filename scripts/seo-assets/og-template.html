<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Anthill Ventures Open Graph card</title>
<!--
  One template for every public/og/<slug>.png (1200 x 630).
  Rendered by scripts/seo-assets/make-assets.mjs, which serves the repo root and opens
  this page as /scripts/seo-assets/og-template.html?title=Scale+with|speed.&seed=3
    title  lines separated by "|"; the last line sits on the red highlight, as in the home hero.
    seed   picks the star field (the curve, wordmark and sub-line never move).
  Safe area: all type and the wordmark stay 80px inside every edge, so any platform crop
  (square, 1.91:1, 4:3 or rounded corners) keeps them. Only decoration bleeds.
-->
<style>
  @font-face {
    font-family: "Archivo";
    font-weight: 400;
    src: url("/public/fonts/d4ec8e6e8337.ttf") format("truetype");
  }
  @font-face {
    font-family: "Archivo";
    font-weight: 500;
    src: url("/public/fonts/1d33b757b42d.ttf") format("truetype");
  }
  :root {
    --night: #0a0507;
    --red: #e6212b;
    --night-text: #eaddde;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--night); }
  #card { position: relative; width: 1200px; height: 630px; overflow: hidden; background: var(--night); }
  #art { position: absolute; inset: 0; width: 1200px; height: 630px; }
  #logo { position: absolute; left: 80px; top: 80px; height: 62px; width: auto; display: block; }
  #copy {
    position: absolute; left: 80px; bottom: 80px;
    display: flex; flex-direction: column; align-items: flex-start; gap: 34px;
  }
  h1 {
    font-family: "Archivo", Helvetica, Arial, sans-serif;
    font-weight: 500; font-size: 124px; line-height: 1.02; letter-spacing: -0.045em; color: #fff;
  }
  h1 .line { display: block; width: fit-content; }
  h1 .hl {
    display: inline-block; background: var(--red); color: #fff;
    padding: 0.01em 0.14em 0.07em; margin-top: 0.04em;
  }
  #sub {
    font-family: "Archivo", Helvetica, Arial, sans-serif;
    font-weight: 400; font-size: 31px; line-height: 1.25; letter-spacing: -0.005em; color: var(--night-text);
  }
</style>
</head>
<body>
<div id="card">
  <svg id="art" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
  <img id="logo" src="/public/brand/logo-original.svg" alt="Anthill Ventures" />
  <div id="copy">
    <h1 id="title"></h1>
    <p id="sub">Capital, mentorship and market access</p>
  </div>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const lines = (q.get("title") || "Scale with|speed.").split("|");
  const seed = parseInt(q.get("seed") || "1", 10);

  // ---- headline: last line on the red highlight
  const h1 = document.getElementById("title");
  lines.forEach((text, i) => {
    const line = document.createElement("span");
    line.className = "line";
    if (i === lines.length - 1) {
      const hl = document.createElement("span");
      hl.className = "hl";
      hl.textContent = text;
      line.appendChild(hl);
    } else line.textContent = text;
    h1.appendChild(line);
  });

  // ---- the growth curve: flat ground, then a steep climb (same shape language as src/components/growth-curve.js)
  const W = 1200, H = 630;
  const GROUND = 612, PEAK = { x: 1062, y: 168 }, POWER = 4.6;
  const rise = GROUND - PEAK.y;
  const curveY = (X) => GROUND - rise * Math.pow(Math.max(0, X) / PEAK.x, POWER);
  const pts = (shift = 0, from = 0, to = W, step = 8) => {
    const out = [];
    for (let X = from; X <= to; X += step) out.push([X, curveY(X) + shift]);
    return out;
  };
  const d = (p) => "M" + p.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join(" L");
  const mainPts = pts(0, 0, W, 6);
  const mainPath = d(mainPts);

  // ---- stars: seeded, kept off the type, the wordmark, the curve and the glowing point
  function rng(s) {
    let a = (s * 2654435761) >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = rng(seed + 11);
  const blocked = (x, y) =>
    (x < 880 && y > 195 && y < 568) ||                          // headline + sub-line
    (x < 300 && y < 160) ||                                      // wordmark
    (y > curveY(x) - 26) ||                                      // below / on the curve
    (Math.hypot(x - PEAK.x, y - PEAK.y) < 90) ||                 // the glowing point
    (x > 480 && x < 700 && y > 14 && y < 110);                   // the shooting star
  const stars = [];
  let guard = 0;
  while (stars.length < 130 && guard++ < 6000) {
    const x = rand() * W, y = rand() * H;
    if (blocked(x, y)) continue;
    if (stars.some((s) => Math.hypot(s.x - x, s.y - y) < 27)) continue;
    stars.push({ x, y, r: 0.55 + rand() * 0.95, a: 0.28 + rand() * 0.5, warm: rand() < 0.14, shine: false });
  }
  stars.sort((a, b) => b.r - a.r).slice(0, 6).forEach((s) => { s.shine = true; s.r = 1.4 + rand() * 0.5; s.a = 0.95; });
  const starSvg = stars.map((s) => {
    const fill = s.warm ? "#ffd7da" : "#ffffff";
    if (!s.shine) return `<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="${s.r.toFixed(2)}" fill="${fill}" fill-opacity="${s.a.toFixed(2)}"/>`;
    const g = 8 + rand() * 6;
    return `<g transform="translate(${s.x.toFixed(1)} ${s.y.toFixed(1)})">
      <circle r="9" fill="url(#halo-soft)"/>
      <path d="M0 ${-g} L1.1 -1.1 L${g} 0 L1.1 1.1 L0 ${g} L-1.1 1.1 L${-g} 0 L-1.1 -1.1Z" fill="${fill}" fill-opacity=".85"/>
      <circle r="${s.r.toFixed(2)}" fill="#fff"/></g>`;
  }).join("");

  // ---- silk: the red surface under the curve, with a few folds
  const silkFill = d(mainPts) + ` L${W} -260 L${W} ${H + 10} L0 ${H + 10} Z`;
  const folds = [
    { dy: 34, o: 0.30, w: 1.6, c: "#ff6a72" },
    { dy: 78, o: 0.22, w: 2.2, c: "#ff4a54" },
    { dy: 132, o: 0.2, w: 3, c: "#c8141d" },
    { dy: 196, o: 0.26, w: 4, c: "#7d0a10" },
  ].map((f) => `<path d="${d(pts(f.dy, 0, W, 8))}" fill="none" stroke="${f.c}" stroke-opacity="${f.o}" stroke-width="${f.w}" stroke-linecap="round" clip-path="url(#under)"/>`).join("");

  const svg = `
  <defs>
    <radialGradient id="ambient" cx="1062" cy="168" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6212b" stop-opacity=".16"/><stop offset="1" stop-color="#e6212b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silk" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#e6212b" stop-opacity="0"/>
      <stop offset=".45" stop-color="#9c0f17" stop-opacity=".30"/>
      <stop offset="1" stop-color="#e6212b" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="silk-shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0507" stop-opacity="0"/><stop offset="1" stop-color="#0a0507" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="${W}" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6212b" stop-opacity="0"/>
      <stop offset=".42" stop-color="#e6212b" stop-opacity=".85"/>
      <stop offset=".80" stop-color="#ff5a63"/>
      <stop offset=".885" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff7c84" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="meteor" x1="520" y1="34" x2="655" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".12" stop-color="#ff7d85" stop-opacity=".85"/>
      <stop offset=".4" stop-color="#e6212b" stop-opacity=".38"/>
      <stop offset="1" stop-color="#e6212b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-soft" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur10" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="blur3" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <clipPath id="under"><path d="${silkFill}"/></clipPath>
  </defs>
  <rect width="${W}" height="${H}" fill="#0a0507"/>
  <rect width="${W}" height="${H}" fill="url(#ambient)"/>
  ${starSvg}
  <path d="M520 34 L655 72" stroke="url(#meteor)" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <circle cx="655" cy="72" r="2.2" fill="#fff"/>
  <path d="${silkFill}" fill="url(#silk)"/>
  <path d="${silkFill}" fill="url(#silk-shade)"/>
  ${folds}
  <path d="${mainPath}" fill="none" stroke="#e6212b" stroke-opacity=".75" stroke-width="16" filter="url(#blur10)" stroke-linecap="round"/>
  <path d="${mainPath}" fill="none" stroke="url(#line)" stroke-width="7" filter="url(#blur3)" stroke-linecap="round" stroke-opacity=".8"/>
  <path d="${mainPath}" fill="none" stroke="url(#line)" stroke-width="3.2" stroke-linecap="round"/>
  <g transform="translate(${PEAK.x} ${PEAK.y})">
    <circle r="120" fill="url(#halo)" opacity=".9"/>
    <circle r="26" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/>
    <circle r="44" fill="none" stroke="#ff7d85" stroke-opacity=".28" stroke-width="1.2"/>
    <path d="M0 -58 L2.6 -2.6 L58 0 L2.6 2.6 L0 58 L-2.6 2.6 L-58 0 L-2.6 -2.6Z" fill="#fff" fill-opacity=".92"/>
    <circle r="9" fill="#fff"/>
  </g>`;
  document.getElementById("art").innerHTML = svg;
  document.documentElement.dataset.ready = "1";
})();
</script>
</body>
</html>
